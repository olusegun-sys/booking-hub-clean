<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Hub - Book Your Perfect Space</title>
    
    <!-- Google Fonts: Plus Jakarta Sans (Inspired by Nigerian Property Center) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Global CSS -->
    <style>
      /* ============================================
         RESET & BASE STYLES
         ============================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0 solid;
      }

      :root {
        /* ============================================
           TYPOGRAPHY - Plus Jakarta Sans (Primary)
           ============================================ */
        --font-primary: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        
        /* ============================================
           COLOR SYSTEM - Inspired by Nigerian Property Center
           ============================================ */
        /* Neutrals */
        --neutral-0: #ffffff;
        --neutral-25: #f5f7fb;
        --neutral-50: #eef0f5;
        --neutral-100: #d9dee8;
        --neutral-200: #b5bccb;
        --neutral-300: #8e96ad;
        --neutral-400: #6a7290;
        --neutral-500: #4a5168;
        --neutral-600: #353a52;
        --neutral-700: #252a40;
        --neutral-800: #1a1f36;
        --neutral-900: #0f142a;
        
        /* Primary - Indigo (Booking Hub Brand) */
        --primary: #4F46E5;
        --primary-hover: #4338CA;
        --primary-light: #EEF2FF;
        --primary-foreground: #ffffff;
        
        /* Secondary - Warm Orange (Accent) */
        --secondary: #F59E0B;
        --secondary-hover: #D97706;
        --secondary-light: #FFFBEB;
        
        /* Success - Green */
        --success: #10B981;
        --success-hover: #059669;
        --success-light: #D1FAE5;
        
        /* Danger - Red */
        --danger: #EF4444;
        --danger-hover: #DC2626;
        --danger-light: #FEE2E2;
        
        /* Warning - Amber */
        --warning: #F59E0B;
        --warning-light: #FEF3C7;
        
        /* Backgrounds & Surfaces */
        --background: var(--neutral-0);
        --surface-1: var(--neutral-25);
        --surface-2: var(--neutral-50);
        --card: var(--neutral-0);
        
        /* Foreground */
        --foreground: var(--neutral-600);
        --foreground-strong: var(--neutral-800);
        --foreground-muted: var(--neutral-500);
        --muted-foreground: var(--neutral-400);
        --muted-foreground-2: var(--neutral-300);
        
        /* Borders */
        --border: var(--neutral-100);
        --border-strong: var(--neutral-200);
        
        /* Shadows */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
        --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.16);
        --shadow-glow-primary: 0 4px 20px rgba(79, 70, 229, 0.3);
        
        /* Border Radius */
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --radius-full: 9999px;
        
        /* Spacing */
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        --spacing-xl: 32px;
        --spacing-2xl: 48px;
        --spacing-3xl: 64px;
        
        /* Transitions */
        --transition-fast: 150ms ease;
        --transition-normal: 250ms ease;
        --transition-slow: 350ms ease;
        
        /* Z-Index Scale */
        --z-dropdown: 100;
        --z-sticky: 200;
        --z-modal: 300;
        --z-overlay: 400;
        --z-toast: 500;
        --z-max: 9999;
      }

      /* ============================================
         HTML & BODY
         ============================================ */
      html {
        -webkit-text-size-adjust: 100%;
        -moz-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
        height: 100%;
      }

      body {
        font-family: var(--font-primary);
        font-feature-settings: 'ss01' on, 'ss02' on, 'ss03' on;
        background-color: var(--background);
        color: var(--foreground);
        line-height: 1.6;
        min-height: 100vh;
        height: 100%;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ============================================
         HEADINGS
         ============================================ */
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-primary);
        font-weight: 700;
        line-height: 1.25;
        color: var(--foreground-strong);
        letter-spacing: -0.02em;
      }

      h1 { font-size: 2.5rem; }
      h2 { font-size: 2rem; }
      h3 { font-size: 1.5rem; }
      h4 { font-size: 1.25rem; }
      h5 { font-size: 1.125rem; }
      h6 { font-size: 1rem; }

      /* ============================================
         LINKS
         ============================================ */
      a {
        color: var(--primary);
        text-decoration: none;
        transition: color var(--transition-fast);
      }

      a:hover {
        color: var(--primary-hover);
      }

      /* ============================================
         BUTTONS
         ============================================ */
      button,
      .btn {
        font-family: var(--font-primary);
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.625rem 1.25rem;
        border-radius: var(--radius-md);
        border: none;
        cursor: pointer;
        transition: all var(--transition-fast);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        line-height: 1.4;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: var(--shadow-glow-primary);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(79, 70, 229, 0.35);
      }

      .btn-secondary {
        background: var(--secondary);
        color: #ffffff;
      }

      .btn-secondary:hover {
        background: var(--secondary-hover);
        transform: translateY(-2px);
      }

      .btn-outline {
        background: transparent;
        color: var(--primary);
        border: 2px solid var(--primary);
      }

      .btn-outline:hover {
        background: var(--primary-light);
        transform: translateY(-2px);
      }

      .btn-success {
        background: var(--success);
        color: #ffffff;
      }

      .btn-success:hover {
        background: var(--success-hover);
        transform: translateY(-2px);
      }

      .btn-danger {
        background: var(--danger);
        color: #ffffff;
      }

      .btn-danger:hover {
        background: var(--danger-hover);
        transform: translateY(-2px);
      }

      /* ============================================
         CARDS
         ============================================ */
      .card {
        background: var(--card);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
        transition: all var(--transition-normal);
        overflow: hidden;
      }

      .card:hover {
        box-shadow: var(--shadow-md);
      }

      .card-premium {
        border: 1px solid rgba(79, 70, 229, 0.15);
        box-shadow: var(--shadow-md);
      }

      .card-premium:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-4px);
      }

      .card-body {
        padding: var(--spacing-lg);
      }

      .card-header {
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--border);
        background: var(--surface-1);
        font-weight: 600;
      }

      /* ============================================
         INPUTS
         ============================================ */
      input,
      textarea,
      select {
        font-family: var(--font-primary);
        font-size: 0.875rem;
        padding: 0.625rem 0.875rem;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--background);
        color: var(--foreground-strong);
        transition: all var(--transition-fast);
        width: 100%;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--muted-foreground);
      }

      label {
        font-family: var(--font-primary);
        font-weight: 500;
        font-size: 0.8125rem;
        color: var(--foreground-muted);
        display: block;
        margin-bottom: var(--spacing-xs);
      }

      /* ============================================
         UTILITY CLASSES
         ============================================ */
      .text-primary { color: var(--primary); }
      .text-secondary { color: var(--secondary); }
      .text-success { color: var(--success); }
      .text-danger { color: var(--danger); }
      .text-muted { color: var(--muted-foreground); }
      .text-strong { color: var(--foreground-strong); }

      .bg-primary { background: var(--primary); }
      .bg-primary-light { background: var(--primary-light); }
      .bg-surface { background: var(--surface-1); }
      .bg-white { background: var(--neutral-0); }

      .font-primary { font-family: var(--font-primary); }
      .font-mono { font-family: var(--font-mono); }

      .fw-300 { font-weight: 300; }
      .fw-400 { font-weight: 400; }
      .fw-500 { font-weight: 500; }
      .fw-600 { font-weight: 600; }
      .fw-700 { font-weight: 700; }
      .fw-800 { font-weight: 800; }

      .text-sm { font-size: 0.8125rem; }
      .text-base { font-size: 0.875rem; }
      .text-lg { font-size: 1rem; }
      .text-xl { font-size: 1.125rem; }
      .text-2xl { font-size: 1.25rem; }
      .text-3xl { font-size: 1.5rem; }
      .text-4xl { font-size: 2rem; }

      .text-center { text-align: center; }
      .text-left { text-align: left; }
      .text-right { text-align: right; }

      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-row { flex-direction: row; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      .gap-sm { gap: var(--spacing-sm); }
      .gap-md { gap: var(--spacing-md); }
      .gap-lg { gap: var(--spacing-lg); }

      .grid { display: grid; }
      .grid-cols-1 { grid-template-columns: 1fr; }
      .grid-cols-2 { grid-template-columns: 1fr 1fr; }
      .grid-cols-3 { grid-template-columns: 1fr 1fr 1fr; }
      .grid-cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .max-w-sm { max-width: 24rem; }
      .max-w-md { max-width: 28rem; }
      .max-w-lg { max-width: 32rem; }
      .max-w-xl { max-width: 36rem; }
      .max-w-2xl { max-width: 42rem; }
      .max-w-3xl { max-width: 48rem; }
      .max-w-4xl { max-width: 56rem; }
      .max-w-6xl { max-width: 72rem; }
      .max-w-7xl { max-width: 80rem; }
      .mx-auto { margin-left: auto; margin-right: auto; }

      .rounded-sm { border-radius: var(--radius-sm); }
      .rounded-md { border-radius: var(--radius-md); }
      .rounded-lg { border-radius: var(--radius-lg); }
      .rounded-xl { border-radius: var(--radius-xl); }
      .rounded-full { border-radius: var(--radius-full); }

      .shadow-sm { box-shadow: var(--shadow-sm); }
      .shadow-md { box-shadow: var(--shadow-md); }
      .shadow-lg { box-shadow: var(--shadow-lg); }
      .shadow-xl { box-shadow: var(--shadow-xl); }

      .p-sm { padding: var(--spacing-sm); }
      .p-md { padding: var(--spacing-md); }
      .p-lg { padding: var(--spacing-lg); }
      .p-xl { padding: var(--spacing-xl); }

      .m-sm { margin: var(--spacing-sm); }
      .m-md { margin: var(--spacing-md); }
      .m-lg { margin: var(--spacing-lg); }
      .m-xl { margin: var(--spacing-xl); }

      .mt-sm { margin-top: var(--spacing-sm); }
      .mt-md { margin-top: var(--spacing-md); }
      .mt-lg { margin-top: var(--spacing-lg); }
      .mt-xl { margin-top: var(--spacing-xl); }

      .mb-sm { margin-bottom: var(--spacing-sm); }
      .mb-md { margin-bottom: var(--spacing-md); }
      .mb-lg { margin-bottom: var(--spacing-lg); }
      .mb-xl { margin-bottom: var(--spacing-xl); }

      .hidden { display: none; }
      .block { display: block; }
      .inline-block { display: inline-block; }
      .inline-flex { display: inline-flex; }

      .overflow-hidden { overflow: hidden; }
      .overflow-auto { overflow: auto; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .fixed { position: fixed; }
      .sticky { position: sticky; }

      .z-dropdown { z-index: var(--z-dropdown); }
      .z-sticky { z-index: var(--z-sticky); }
      .z-modal { z-index: var(--z-modal); }
      .z-overlay { z-index: var(--z-overlay); }
      .z-toast { z-index: var(--z-toast); }
      .z-max { z-index: var(--z-max); }

      /* ============================================
         SCROLLBAR
         ============================================ */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--surface-1);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--neutral-300);
        border-radius: var(--radius-full);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--neutral-400);
      }

      /* ============================================
         ANIMATIONS
         ============================================ */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .animate-fadeIn {
        animation: fadeIn 0.4s ease forwards;
      }

      .animate-slideUp {
        animation: slideUp 0.5s ease forwards;
      }

      .animate-scaleIn {
        animation: scaleIn 0.3s ease forwards;
      }

      .animate-pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      /* ============================================
         RESPONSIVE BREAKPOINTS
         ============================================ */
      /* Mobile First - Default styles are for mobile */

      /* Tablet: 768px and up */
      @media (min-width: 768px) {
        h1 { font-size: 3rem; }
        h2 { font-size: 2.5rem; }
        h3 { font-size: 1.75rem; }
        h4 { font-size: 1.375rem; }
        
        .grid-cols-md-2 { grid-template-columns: 1fr 1fr; }
        .grid-cols-md-3 { grid-template-columns: 1fr 1fr 1fr; }
        
        .p-md-lg { padding: var(--spacing-xl); }
      }

      /* Desktop: 1024px and up */
      @media (min-width: 1024px) {
        h1 { font-size: 3.5rem; }
        
        .grid-cols-lg-2 { grid-template-columns: 1fr 1fr; }
        .grid-cols-lg-3 { grid-template-columns: 1fr 1fr 1fr; }
        .grid-cols-lg-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      }

      /* Large Desktop: 1280px and up */
      @media (min-width: 1280px) {
        .grid-cols-xl-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
      }

      /* ============================================
         SELECTION
         ============================================ */
      ::selection {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      /* ============================================
         FOCUS VISIBLE (Accessibility)
         ============================================ */
      *:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* ============================================
         APP CONTAINER
         ============================================ */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: var(--font-primary);
      }

      /* ============================================
         LOADING SPINNER
         ============================================ */
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ============================================
         GRADIENT TEXT
         ============================================ */
      .gradient-text {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ============================================
         BADGE
         ============================================ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-xs);
        font-family: var(--font-primary);
        font-size: 0.6875rem;
        font-weight: 600;
        padding: 0.1875rem 0.625rem;
        border-radius: var(--radius-full);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .badge-primary {
        background: var(--primary-light);
        color: var(--primary);
      }

      .badge-success {
        background: var(--success-light);
        color: var(--success);
      }

      .badge-danger {
        background: var(--danger-light);
        color: var(--danger);
      }

      .badge-warning {
        background: var(--warning-light);
        color: var(--warning);
      }

      .badge-premium {
        background: linear-gradient(135deg, #d97706, #f59e0b);
        color: #ffffff;
      }

      /* ============================================
         TOAST NOTIFICATIONS
         ============================================ */
      .toast-container {
        position: fixed;
        bottom: var(--spacing-lg);
        right: var(--spacing-lg);
        z-index: var(--z-toast);
        display: flex;
        flex-direction: column;
        gap: var(--spacing-sm);
        max-width: 400px;
        width: 100%;
      }

      .toast {
        padding: var(--spacing-md) var(--spacing-lg);
        border-radius: var(--radius-md);
        background: var(--neutral-800);
        color: #ffffff;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.3s ease forwards;
        font-family: var(--font-primary);
        font-size: 0.875rem;
      }

      .toast-success {
        background: var(--success);
      }

      .toast-error {
        background: var(--danger);
      }

      .toast-warning {
        background: var(--warning);
        color: var(--neutral-800);
      }

      /* ============================================
         RESPONSIVE TOAST
         ============================================ */
      @media (max-width: 768px) {
        .toast-container {
          bottom: var(--spacing-md);
          right: var(--spacing-md);
          left: var(--spacing-md);
          max-width: 100%;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
