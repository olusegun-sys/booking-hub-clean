services:
  - type: web
    name: booking-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ALLOWED_ORIGINS
        value: https://booking-frontend-clean.onrender.com,http://localhost:5173

  - type: web
    name: booking-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    publishDirectory: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://booking-backend-clean.onrender.com
